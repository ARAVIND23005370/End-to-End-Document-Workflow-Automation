# Test Configuration
spring.application.name=e2edocs-backend-test

# H2 In-Memory Database for fast, isolated tests
spring.datasource.url=jdbc:h2:mem:e2edocs_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT & Storage for Tests
e2edocs.jwt.secret=e2edocs-super-secret-jwt-signing-key-minimum-256-bits-length-token-key-2026-test
e2edocs.jwt.expiration-ms=3600000
e2edocs.storage.directory=target/test-uploads/
e2edocs.cors.allowed-origins=http://localhost:5173

# Disable auto seed in generic tests if desired, or enable
e2edocs.seed.enabled=false
