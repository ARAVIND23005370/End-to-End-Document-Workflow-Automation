# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Spring Boot Configuration
spring.application.name=e2edocs-backend

# Database Configuration (Supabase PostgreSQL IPv4 Pooler)
spring.datasource.url=jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-1.pooler.supabase.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&connectTimeout=30&socketTimeout=30
spring.datasource.username=${DB_USERNAME:postgres.ytchrjgkrygvfvdzdrfh}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Multipart / File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Mail Configuration (SMTP)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.from=${MAIL_FROM:no-reply@e2edocs.com}
spring.mail.from-name=${MAIL_FROM_NAME:E2EDocs Platform}

# Application Specific Properties
e2edocs.app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
e2edocs.jwt.secret=${JWT_SECRET:e2edocs-super-secret-jwt-signing-key-minimum-256-bits-length-token-key-2026}
e2edocs.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
e2edocs.storage.directory=${E2EDOCS_STORAGE_DIRECTORY:uploads/}
e2edocs.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.onrender.com}

# Seed Data Configuration (Disabled by default for clean/bootstrap operation)
e2edocs.seed.enabled=${E2EDOCS_SEED_ENABLED:false}
e2edocs.seed.admin-email=${E2EDOCS_SEED_ADMIN_EMAIL:admin@e2edocs.local}
e2edocs.seed.admin-password=${E2EDOCS_SEED_ADMIN_PASSWORD:admin123}
