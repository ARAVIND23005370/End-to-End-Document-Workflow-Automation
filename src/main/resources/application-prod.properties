# ===================================================================
# E2EDocs - Production Configuration Profile (prod)
# ===================================================================

# Server Configuration & Graceful Shutdown
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Application Identification
spring.application.name=e2edocs-backend

# Production Database Configuration (PostgreSQL / Supabase)
spring.datasource.url=jdbc:postgresql://${DB_HOST:db.ytchrjgkrygvfvdzdrfh.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSL_MODE:require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload / Ingestion Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Security & Authentication (Environment Driven)
e2edocs.jwt.secret=${JWT_SECRET:}
e2edocs.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
e2edocs.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.onrender.com}

# Persistent Storage Mount Directory
e2edocs.storage.directory=${E2EDOCS_STORAGE_DIRECTORY:/app/storage/}

# Production Seed Policy (Bootstrap signup initializes the first Main Admin)
e2edocs.seed.enabled=${E2EDOCS_SEED_ENABLED:false}

# Actuator Health Probes & Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# Production Structured Logging with Request Correlation
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} [corrId=%X{correlationId:-none}] - %msg%n
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.e2edocs=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
