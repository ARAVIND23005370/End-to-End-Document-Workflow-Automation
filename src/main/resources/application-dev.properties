# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Spring Boot Configuration
spring.application.name=e2edocs-backend-dev

# Local In-Memory Database with PostgreSQL Mode
spring.datasource.url=jdbc:h2:mem:e2edocs_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Multipart / File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Application Specific Properties
e2edocs.jwt.secret=${JWT_SECRET:e2edocs-super-secret-jwt-signing-key-minimum-256-bits-length-token-key-2026}
e2edocs.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
e2edocs.storage.directory=${E2EDOCS_STORAGE_DIRECTORY:uploads/}
e2edocs.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.onrender.com}

# Auto Bootstrap Seeding
e2edocs.seed.enabled=${E2EDOCS_SEED_ENABLED:true}
e2edocs.seed.admin-email=${E2EDOCS_SEED_ADMIN_EMAIL:admin@e2edocs.local}
e2edocs.seed.admin-password=${E2EDOCS_SEED_ADMIN_PASSWORD:AdminSecurePass2026!}

# Mail Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtps
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.starttls.enable=false
spring.mail.properties.mail.smtps.ssl.enable=true
spring.mail.properties.mail.smtps.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtps.socketFactory.port=465
spring.mail.properties.mail.smtps.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtps.socketFactory.fallback=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.default-encoding=UTF-8
spring.mail.from=${MAIL_FROM:no-reply@e2edocs.com}
spring.mail.from-name=${MAIL_FROM_NAME:E2EDocs Platform}
